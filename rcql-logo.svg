<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer Red Border Box -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#d31027" stroke-width="7"/>
  
  <!-- Cross (+ Lines) -->
  <line x1="100" y1="10" x2="100" y2="190" stroke="#d31027" stroke-width="7"/>
  <line x1="10" y1="100" x2="190" y2="100" stroke="#d31027" stroke-width="7"/>
  
  <!-- Letters R C Q L -->
  <text x="55" y="72" font-family="'Rajdhani', 'Space Grotesk', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#111111" text-anchor="middle" dominant-baseline="central">R</text>
  <text x="145" y="72" font-family="'Rajdhani', 'Space Grotesk', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#111111" text-anchor="middle" dominant-baseline="central">C</text>
  <text x="55" y="152" font-family="'Rajdhani', 'Space Grotesk', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#111111" text-anchor="middle" dominant-baseline="central">Q</text>
  <text x="145" y="152" font-family="'Rajdhani', 'Space Grotesk', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#111111" text-anchor="middle" dominant-baseline="central">L</text>
</svg>
